name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: blueberrypieos/workflows/.github/workflows/build.yml@v2
    with:
      ports-repository: https://blueberrypieos.com/apt blueberry-pie-os
      ports-components: core
      ports-keyring-url: https://blueberrypieos.com/apt/pie-archive-keyring.asc
  attest:
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref_type == 'tag' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: blueberrypieos/workflows/.github/workflows/attest.yml@v2
    with:
      artifact: ${{ needs.build.outputs.artifact }}
  release:
    needs: [build, attest]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    uses: blueberrypieos/workflows/.github/workflows/release.yml@v2
    with:
      artifact: ${{ needs.build.outputs.artifact }}
